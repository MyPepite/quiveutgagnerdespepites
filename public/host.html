<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pépites · Télécommande</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b24">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/play.css">
  <style>
    .rc { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 24px; max-width: 480px; margin: 0 auto; width: 100%; min-height: 100vh; min-height: 100dvh; }
    .rc h1 { font-size: 22px; font-weight: 900; }
    .rc .sub { color: var(--muted); font-size: 15px; }
    .rc .box { border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 6px; background: rgba(255,255,255,0.05); }
    .rc .box b { font-size: 20px; color: var(--gold-hi); }
    .rc .btn { font-size: 20px; padding: 18px; }
    .rc .row { display: grid; gap: 10px; }
    .rc .danger { border-color: var(--ko); color: #ffb3b8; }
    .rc .field { display: grid; gap: 6px; font-weight: 700; }
    .rc select { padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: rgba(255,255,255,0.08); font-size: 17px; }
    .rc select option { color: #111; }
    .rc ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .rc li { padding: 4px 12px; border-radius: 99px; background: rgba(255,255,255,0.1); font-weight: 700; font-size: 15px; }
    .rc li.off { opacity: 0.45; }
  </style>
</head>
<body class="phone">
  <div id="status" class="status" hidden>Reconnexion…</div>
  <div id="app"></div>
  <script src="/common.js"></script>
  <script src="/host.js"></script>
</body>
</html>
