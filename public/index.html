<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pépites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/base.css">
  <style>
    main { min-height: 100vh; display: grid; place-content: center; gap: 18px; padding: 24px; max-width: 520px; margin: 0 auto; text-align: center; justify-items: center; }
    main img { width: 90px; }
    h1 { font-size: 34px; font-weight: 900; }
    p { color: var(--muted); font-size: 18px; line-height: 1.4; }
    a.btn { display: block; width: 100%; text-decoration: none; font-size: 20px; padding: 16px; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="">
    <h1>Pépites</h1>
    <p>Les jeux de la salle, sur la TV et sur les téléphones.</p>
    <a class="btn btn-gold" href="/tv">Ouvrir l’écran TV</a>
    <a class="btn" href="/jouer">Rejoindre avec un code</a>
  </main>
</body>
</html>
